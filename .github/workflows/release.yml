name: Release macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cue-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Add the TAURI_SIGNING_PRIVATE_KEY repository secret before releasing."; exit 1; }
          node -e 'if (process.arch !== "arm64") throw new Error("Use an arm64 runner")'
          VERSION=$(node -p 'require("./cue-app/src-tauri/tauri.conf.json").version')
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag and app version must match."; exit 1
          fi
          echo "CUE_RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun install --cwd cue-app --frozen-lockfile
      - name: Build installer tools
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg-tools"
          "$RUNNER_TEMP/dmg-tools/bin/python" -m pip install -r scripts/requirements-dmg.txt
          echo "CUE_DMG_PYTHON=$RUNNER_TEMP/dmg-tools/bin/python" >> "$GITHUB_ENV"
      - name: Build and seal the app
        working-directory: cue-app
        run: bun run bundle:unsigned
      - name: Sign the final updater archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/package-update.mjs
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$CUE_RELEASE_TAG" \
            .local/release/artifacts/cue-apple-silicon.dmg \
            .local/release/artifacts/cue.app.tar.gz \
            .local/release/artifacts/cue.app.tar.gz.sig \
            .local/release/artifacts/latest.json \
            --target "$GITHUB_SHA" --title "cue ${CUE_RELEASE_TAG#v}" --generate-notes
