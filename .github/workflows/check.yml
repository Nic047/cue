name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun install --cwd cue-app --frozen-lockfile
      - run: bun run check
      - run: cargo fmt --manifest-path cue-app/src-tauri/Cargo.toml --check
      - run: cargo check --locked --manifest-path cue-app/src-tauri/Cargo.toml
